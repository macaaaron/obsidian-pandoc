
name: Build Obsidian Pandoc

on:
  push:
    branches:
      - fix/quoted-pandoc-arguments
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-pandoc-fixed
          path: |
            main.js
            manifest.json
            styles.css
